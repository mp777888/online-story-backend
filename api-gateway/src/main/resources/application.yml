server:
  port: 9000

spring:
    application:
        name: api-gateway
    threads:
      virtual:
        enabled: true
    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: http://localhost:8181/realms/online-stories-realm
    cloud:
      gateway:
        discovery:
          locator:
            enabled: true
        server:
          webmvc:
            routes:
              - id: user-service
                uri: http://localhost:8081
                predicates:
                  - Path=/api/users/**
              - id: auth-service
                uri: http://localhost:8082
                predicates:
                  - Path=/api/auth/**
              - id: story-service
                uri: http://localhost:8083
                predicates:
                  - Path=/api/stories/**
              - id: media-service
                uri: http://localhost:8084
                predicates:
                  - Path=/api/media/**
              - id: trans-service
                uri: http://localhost:8085
                predicates:
                  - Path=/api/transactions/**
              - id: recommend-service
                uri: http://localhost:8086
                predicates:
                  - Path=/api/recommend/**
              - id: report-service
                uri: http://localhost:8087
                predicates:
                  - Path=/api/reports/**
              - id : ai-service
                uri: http://localhost:8088
                predicates:
                  - Path=/api/ai/**
              - id : social-service
                uri: http://localhost:8089
                predicates:
                  - Path=/api/social/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
