server:
  port: 8085
spring:
  application:
    name: transaction-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DB}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${spring.application.name}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8181/realms/online-stories-realm}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.security: DEBUG
    org.apache.kafka.clients.NetworkClient: ERROR
    org.apache.kafka.clients.Metadata: ERROR
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: WARN

payment:
  vnPay:
    url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    tmnCode: ${VN_PAY_TMN_CODE}
    secretKey: ${VN_PAY_SECRET_KEY}
    returnUrl: http://localhost:8085/api/transactions/vn-pay-call-back
    version: 2.1.0
    command: pay
    orderType: other
  momo:
    partner-code: ${MOMO_PARTNER_CODE}
    access-key: ${MOMO_ACCESS_KEY}
    secret-key: ${MOMO_SECRET_KEY}
    endpoint: https://test-payment.momo.vn/v2/gateway/api/create
    redirect-url: ${MOMO_REDIRECT_URL:http://localhost:8085/api/transactions/momo-call-back}
    ipn-url: ${MOMO_IPN_URL:http://localhost:8085/api/transactions/momo-call-back}
