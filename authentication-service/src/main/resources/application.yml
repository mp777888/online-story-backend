server:
  port: 8082

spring:
  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true
      timeout: 5000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  application:
    name: authentication-service

keycloak:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8181}
    realm: ${REALM}
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}

app:
  keycloak:
    realm: ${REALM}
    redirect-uri: ${KEYCLOAK_REDIRECT_URI:http://localhost:3000}

eureka:
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: false
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/